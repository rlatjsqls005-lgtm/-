name: Build iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Validate project
        run: xcodebuild -list -project TradeBook.xcodeproj
      - name: Build iOS simulator app
        run: |
          xcodebuild -project TradeBook.xcodeproj -scheme TradeBook -sdk iphonesimulator -configuration Release -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Package app
        run: |
          set -e
          APP=$(find build/DerivedData/Build/Products -path '*iphonesimulator*' -name 'TradeBook.app' -type d | head -1)
          test -n "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/TradeBook.app
          cd build
          zip -r ../TradeBook-ios-simulator.zip Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: TradeBook-ios-simulator.zip
