name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail
          APK_UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -name '*unsigned.apk' -print -quit)
          test -n "$APK_UNSIGNED"
          SDK_BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          APKSIGNER="$SDK_BUILD_TOOLS/apksigner"
          ZIPALIGN="$SDK_BUILD_TOOLS/zipalign"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          keytool -genkeypair -v -keystore tradebook-release.jks -alias tradebook -keyalg RSA -keysize 2048 -validity 10000 -storepass changeit -keypass changeit -dname 'CN=TradeBook, OU=App, O=TradeBook, L=Seoul, ST=Seoul, C=KR'
          "$ZIPALIGN" -f -p 4 "$APK_UNSIGNED" app-release-aligned.apk
          "$APKSIGNER" sign --ks tradebook-release.jks --ks-key-alias tradebook --ks-pass pass:changeit --key-pass pass:changeit --out app-release.apk app-release-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs app-release.apk
          rm -f app-release-aligned.apk tradebook-release.jks
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tradebook-apk
          path: app-release.apk
          if-no-files-found: error
