name: Build iOS

on:
  push:
    branches: [ ios-app ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iOS app
        run: |
          mkdir -p build/Payload
          xcodebuild -project TradeBook.xcodeproj -scheme TradeBook -sdk iphonesimulator -configuration Release -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Package app
        run: |
          APP=$(find build/DerivedData/Build/Products -name 'TradeBook.app' -type d | head -1)
          cp -R "$APP" build/Payload/TradeBook.app
          cd build && zip -r ../TradeBook-ios-unsigned.zip Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: TradeBook-ios-unsigned.zip
